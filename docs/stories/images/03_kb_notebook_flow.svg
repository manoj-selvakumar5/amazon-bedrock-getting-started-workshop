<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" font-family="Arial, Helvetica, sans-serif">
  <title>Notebook flow for Module 3</title>
  <desc>Six notebook sections in order: set up, create and ingest, retrieve, grounded chat, expense checks, and try it. Each section is labelled with the architecture diagram steps it uses.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
  </defs>
  <rect width="1200" height="250" fill="#ffffff"/>

  <!-- Phase bars -->
  <rect x="25" y="20" width="366" height="26" rx="4" fill="#3F8624"/>
  <text x="208" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">BUILD</text>
  <rect x="417" y="20" width="170" height="26" rx="4" fill="#146EB4"/>
  <text x="502" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">TEST</text>
  <rect x="613" y="20" width="366" height="26" rx="4" fill="#FF9900"/>
  <text x="796" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">APPLY</text>
  <rect x="1005" y="20" width="170" height="26" rx="4" fill="#5f6b7a"/>
  <text x="1090" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OPTIONAL</text>

  <!-- Section boxes -->
  <rect x="25" y="62" width="170" height="104" rx="8" fill="#e9f5e4" stroke="#3F8624" stroke-width="2"/>
  <rect x="221" y="62" width="170" height="104" rx="8" fill="#e9f5e4" stroke="#3F8624" stroke-width="2"/>
  <rect x="417" y="62" width="170" height="104" rx="8" fill="#e8f1fb" stroke="#146EB4" stroke-width="2"/>
  <rect x="613" y="62" width="170" height="104" rx="8" fill="#fff8ec" stroke="#FF9900" stroke-width="2"/>
  <rect x="809" y="62" width="170" height="104" rx="8" fill="#fff8ec" stroke="#FF9900" stroke-width="2"/>
  <rect x="1005" y="62" width="170" height="104" rx="8" fill="#f2f3f3" stroke="#5f6b7a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Section numbers -->
  <g font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="45" cy="82" r="11" fill="#232F3E"/><text x="45" y="86">1</text>
    <circle cx="241" cy="82" r="11" fill="#232F3E"/><text x="241" y="86">2</text>
    <circle cx="437" cy="82" r="11" fill="#232F3E"/><text x="437" y="86">3</text>
    <circle cx="633" cy="82" r="11" fill="#232F3E"/><text x="633" y="86">4</text>
    <circle cx="829" cy="82" r="11" fill="#232F3E"/><text x="829" y="86">5</text>
    <circle cx="1025" cy="82" r="11" fill="#232F3E"/><text x="1025" y="86">6</text>
  </g>

  <!-- Section titles and details -->
  <g text-anchor="middle" fill="#232F3E">
    <text x="118" y="112" font-size="15" font-weight="bold">Set up</text>
    <text x="110" y="132" font-size="12">S3 bucket, policy files,</text>
    <text x="110" y="148" font-size="12">read-only service role</text>

    <text x="314" y="112" font-size="15" font-weight="bold">Create and ingest</text>
    <text x="306" y="132" font-size="12">create_knowledge_base,</text>
    <text x="306" y="148" font-size="12">start_ingestion_job</text>

    <text x="510" y="112" font-size="15" font-weight="bold">Retrieve</text>
    <text x="502" y="132" font-size="12">top passages with</text>
    <text x="502" y="148" font-size="12">source and score</text>

    <text x="706" y="112" font-size="15" font-weight="bold">Grounded chat</text>
    <text x="698" y="132" font-size="12">retrieve + converse,</text>
    <text x="698" y="148" font-size="12">answers with citations</text>

    <text x="902" y="112" font-size="15" font-weight="bold">Expense checks</text>
    <text x="894" y="132" font-size="12">one search per type,</text>
    <text x="894" y="148" font-size="12">7 sample reports</text>

    <text x="1098" y="112" font-size="15" font-weight="bold">Try it</text>
    <text x="1090" y="132" font-size="12">edit a policy, re-ingest,</text>
    <text x="1090" y="148" font-size="12">ask the same question</text>
  </g>

  <!-- Arrows between sections -->
  <g stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)">
    <line x1="195" y1="114" x2="219" y2="114"/>
    <line x1="391" y1="114" x2="415" y2="114"/>
    <line x1="587" y1="114" x2="611" y2="114"/>
    <line x1="783" y1="114" x2="807" y2="114"/>
    <line x1="979" y1="114" x2="1003" y2="114" stroke-dasharray="4 3"/>
  </g>

  <!-- Links to architecture diagram steps -->
  <text x="25" y="204" font-size="12" font-weight="bold" fill="#232F3E">Architecture diagram steps used:</text>
  <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <!-- section 1 -->
    <circle cx="110" cy="228" r="10" fill="#146EB4"/><text x="110" y="232">1</text>
    <!-- section 2 -->
    <circle cx="296" cy="228" r="10" fill="#146EB4"/><text x="296" y="232">1</text>
    <circle cx="322" cy="228" r="10" fill="#146EB4"/><text x="322" y="232">2</text>
    <!-- section 3 -->
    <circle cx="502" cy="228" r="10" fill="#146EB4"/><text x="502" y="232">3</text>
    <!-- section 4 -->
    <circle cx="685" cy="228" r="10" fill="#146EB4"/><text x="685" y="232">3</text>
    <circle cx="711" cy="228" r="10" fill="#146EB4"/><text x="711" y="232">4</text>
    <!-- section 5 -->
    <circle cx="881" cy="228" r="10" fill="#146EB4"/><text x="881" y="232">3</text>
    <circle cx="907" cy="228" r="10" fill="#146EB4"/><text x="907" y="232">4</text>
    <!-- section 6 -->
    <circle cx="1052" cy="228" r="10" fill="#146EB4"/><text x="1052" y="232">1</text>
    <circle cx="1078" cy="228" r="10" fill="#146EB4"/><text x="1078" y="232">2</text>
    <circle cx="1104" cy="228" r="10" fill="#146EB4"/><text x="1104" y="232">3</text>
    <circle cx="1130" cy="228" r="10" fill="#146EB4"/><text x="1130" y="232">4</text>
  </g>
</svg>
